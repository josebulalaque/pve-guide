<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="20" y="20" width="260" height="110" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="150" y="58.8" font-family="Liberation Sans" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2937">HEALTH_OK</text><text x="150" y="79.8" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">All good.</text><text x="150" y="96.8" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">Nothing to do.</text><rect x="300" y="20" width="260" height="110" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="430" y="58.8" font-family="Liberation Sans" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2937">HEALTH_WARN</text><text x="430" y="79.8" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">Needs attention: an OSD down,</text><text x="430" y="96.8" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">recovering, or nearly full. VMs keep running.</text><rect x="580" y="20" width="260" height="110" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="710" y="58.8" font-family="Liberation Sans" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2937">HEALTH_ERR</text><text x="710" y="79.8" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">Serious: data may be unreachable</text><text x="710" y="96.8" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">and VM disks can freeze. Act now.</text>
</svg>