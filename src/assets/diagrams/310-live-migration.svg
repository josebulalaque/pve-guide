<rect x="30" y="20" width="220" height="110" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="140" y="44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Node 1</text><rect x="60" y="60" width="160" height="50" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="140" y="79.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">VM 101</text><text x="140" y="98.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">running</text><rect x="610" y="20" width="220" height="110" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="720" y="44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Node 2</text><rect x="640" y="60" width="160" height="50" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6" stroke-dasharray="6 4"/><text x="720" y="79.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">VM 101</text><text x="720" y="98.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">running</text><text x="430" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">1. Copy memory while the VM keeps running</text><text x="430" y="80" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">2. Pause for a moment and copy the last changes</text><text x="430" y="110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">3. Resume on Node 2</text><line x1="255" y1="120" x2="605" y2="120" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="30" y="170" width="800" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="430" y="198.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Shared storage (Ceph): the disk stays where it is, only memory moves</text><line x1="140" y1="130" x2="140" y2="168" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><line x1="720" y1="130" x2="720" y2="168" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="430" y="248" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="italic" text-anchor="middle" fill="#4B5563">On local storage, the disk has to be copied too, which is much slower.</text>
</svg>