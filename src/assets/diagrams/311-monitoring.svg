<svg xmlns="http://www.w3.org/2000/svg" width="860" height="295" viewBox="0 0 860 295">
<style>@media (prefers-color-scheme: dark){[fill="#F3F4F6"]{fill:#262a33}[fill="#DBEAFE"]{fill:#172554}[fill="#EDE9FE"]{fill:#2e1065}[fill="#FFEDD5"]{fill:#431407}[fill="#DCFCE7"]{fill:#052e16}[fill="#E0F2FE"]{fill:#082f49}[fill="#FEF3C7"]{fill:#422006}[fill="#FEE2E2"]{fill:#450a0a}[fill="#FAFAFA"]{fill:#1b1d24}[fill="#F9FAFB"]{fill:#23262f}[stroke="#6B7280"]{stroke:#9ca3af}[stroke="#2563EB"]{stroke:#60a5fa}[stroke="#7C3AED"]{stroke:#a78bfa}[stroke="#EA580C"]{stroke:#fb923c}[stroke="#16A34A"]{stroke:#4ade80}[stroke="#0284C7"]{stroke:#38bdf8}[stroke="#D97706"]{stroke:#fbbf24}[stroke="#DC2626"]{stroke:#f87171}[stroke="#9CA3AF"]{stroke:#6b7280}[stroke="#E5E7EB"]{stroke:#374151}[stroke="#D1D5DB"]{stroke:#4b5563}:not(circle)[fill="#6B7280"]{fill:#9ca3af}:not(circle)[fill="#2563EB"]{fill:#60a5fa}:not(circle)[fill="#7C3AED"]{fill:#a78bfa}:not(circle)[fill="#EA580C"]{fill:#fb923c}:not(circle)[fill="#16A34A"]{fill:#4ade80}:not(circle)[fill="#0284C7"]{fill:#38bdf8}:not(circle)[fill="#D97706"]{fill:#fbbf24}:not(circle)[fill="#DC2626"]{fill:#f87171}text[fill="#1F2937"]{fill:#e5e7eb}[fill="#4B5563"]{fill:#9ca3af}rect[fill="#FFFFFF"]{fill:#23262f}text[stroke="#FFFFFF"]{stroke:#17181c}}</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<text x="120" y="26" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Proxmox records…</text><rect x="20" y="40" width="200" height="52" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="120" y="60.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Task log</text><text x="120" y="78.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">every action and its result</text><rect x="20" y="102" width="200" height="52" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="120" y="122.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">System log (journal)</text><text x="120" y="140.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">service messages per node</text><rect x="20" y="164" width="200" height="52" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="120" y="184.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Usage graphs (RRD)</text><text x="120" y="202.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">CPU, RAM, disk, network</text><rect x="20" y="226" width="200" height="52" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="120" y="246.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Ceph health</text><text x="120" y="264.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">storage status</text><line x1="222" y1="150" x2="318" y2="150" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="322" y="110" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="422" y="135.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Proxmox VE</text><text x="422" y="154.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">shows it in the web UI</text><text x="422" y="170.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">and through the API</text><text x="740" y="26" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">…and can send it on</text><line x1="522" y1="130" x2="628" y2="72" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="522" y1="170" x2="628" y2="228" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="632" y="40" width="210" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="737" y="60.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Metric server</text><text x="737" y="78.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">InfluxDB or Graphite,</text><text x="737" y="94.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">then dashboards (e.g. Grafana)</text><rect x="632" y="190" width="210" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="737" y="210.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Notifications</text><text x="737" y="228.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">email, Gotify or webhook</text><text x="737" y="244.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">e.g. backup failed</text>
</svg>