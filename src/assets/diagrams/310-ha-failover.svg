<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180">
<style>@media (prefers-color-scheme: dark){[fill="#F3F4F6"]{fill:#262a33}[fill="#DBEAFE"]{fill:#172554}[fill="#EDE9FE"]{fill:#2e1065}[fill="#FFEDD5"]{fill:#431407}[fill="#DCFCE7"]{fill:#052e16}[fill="#E0F2FE"]{fill:#082f49}[fill="#FEF3C7"]{fill:#422006}[fill="#FEE2E2"]{fill:#450a0a}[fill="#FAFAFA"]{fill:#1b1d24}[fill="#F9FAFB"]{fill:#23262f}[stroke="#6B7280"]{stroke:#9ca3af}[stroke="#2563EB"]{stroke:#60a5fa}[stroke="#7C3AED"]{stroke:#a78bfa}[stroke="#EA580C"]{stroke:#fb923c}[stroke="#16A34A"]{stroke:#4ade80}[stroke="#0284C7"]{stroke:#38bdf8}[stroke="#D97706"]{stroke:#fbbf24}[stroke="#DC2626"]{stroke:#f87171}[stroke="#9CA3AF"]{stroke:#6b7280}[stroke="#E5E7EB"]{stroke:#374151}[stroke="#D1D5DB"]{stroke:#4b5563}:not(circle)[fill="#6B7280"]{fill:#9ca3af}:not(circle)[fill="#2563EB"]{fill:#60a5fa}:not(circle)[fill="#7C3AED"]{fill:#a78bfa}:not(circle)[fill="#EA580C"]{fill:#fb923c}:not(circle)[fill="#16A34A"]{fill:#4ade80}:not(circle)[fill="#0284C7"]{fill:#38bdf8}:not(circle)[fill="#D97706"]{fill:#fbbf24}:not(circle)[fill="#DC2626"]{fill:#f87171}text[fill="#1F2937"]{fill:#e5e7eb}[fill="#4B5563"]{fill:#9ca3af}rect[fill="#FFFFFF"]{fill:#23262f}text[stroke="#FFFFFF"]{stroke:#17181c}}</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect x="20" y="25" width="190" height="80" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="115" y="59.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">1. Node 2 fails</text><text x="115" y="78.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">power, hardware or network</text><line x1="210" y1="65" x2="228" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="230" y="25" width="190" height="80" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="325" y="59.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">2. Node 2 fences itself</text><text x="325" y="78.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">its watchdog forces a reboot</text><line x1="420" y1="65" x2="438" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="440" y="25" width="190" height="80" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="535" y="59.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">3. The cluster waits</text><text x="535" y="78.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">until fencing is certain</text><line x1="630" y1="65" x2="648" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="650" y="25" width="190" height="80" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="745" y="59.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">4. HA restarts the VMs</text><text x="745" y="78.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">on Node 1 and Node 3</text><text x="430" y="140" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">The VMs are restarted, not live-moved: expect a few minutes of downtime.</text><text x="430" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Needs: quorum on the surviving nodes, shared storage, and the VMs added as HA resources.</text>
</svg>