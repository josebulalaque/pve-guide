<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="20" y="25" width="190" height="80" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="115" y="59.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">1. Node 2 fails</text><text x="115" y="78.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">power, hardware or network</text><line x1="210" y1="65" x2="228" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="230" y="25" width="190" height="80" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="325" y="59.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">2. Node 2 fences itself</text><text x="325" y="78.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">its watchdog forces a reboot</text><line x1="420" y1="65" x2="438" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="440" y="25" width="190" height="80" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="535" y="59.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">3. The cluster waits</text><text x="535" y="78.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">until fencing is certain</text><line x1="630" y1="65" x2="648" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="650" y="25" width="190" height="80" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="745" y="59.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">4. HA restarts the VMs</text><text x="745" y="78.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">on Node 1 and Node 3</text><text x="430" y="140" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">The VMs are restarted, not live-moved: expect a few minutes of downtime.</text><text x="430" y="162" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Needs: quorum on the surviving nodes, shared storage, and the VMs added as HA resources.</text>
</svg>