tly on the hardware: fast, built for servers</text><text x="630" y="32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">Type 2 — "hosted"</text><text x="630" y="54" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">VirtualBox, VMware Workstation, Parallels</text><rect x="460" y="100" width="165" height="80" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="542.5" y="134.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">VM</text><text x="542.5" y="153.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">guest OS + apps</text><rect x="635" y="100" width="165" height="80" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="717.5" y="134.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">VM</text><text x="717.5" y="153.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">guest OS + apps</text><rect x="460" y="190" width="340" height="45" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="630" y="216.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Hypervisor app</text><rect x="460" y="245" width="340" height="45" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="630" y="271.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Desktop OS (Windows / macOS / Linux)</text><rect x="460" y="300" width="340" height="45" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/>