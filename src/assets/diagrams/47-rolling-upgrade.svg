<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="20" y="26" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="start" fill="#1F2937">One node at a time:</text><rect x="20" y="40" width="124" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="82" y="68.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Latest 8.4</text><line x1="144" y1="65" x2="158" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="160" y="40" width="124" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="222" y="68.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Ceph → Squid</text><line x1="284" y1="65" x2="298" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="40" width="124" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="362" y="68.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">pve8to9 --full</text><line x1="424" y1="65" x2="438" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="440" y="40" width="124" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="502" y="68.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Migrate VMs off</text><line x1="564" y1="65" x2="578" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="40" width="124" height="50" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="642" y="68.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Upgrade + reboot</text><line x1="704" y1="65" x2="718" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="720" y="40" width="124" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="782" y="68.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Back in service</text><text x="330" y="108" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Ceph must be on Squid on every node before any node moves to PVE 9</text><text x="80" y="165" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="end" fill="#1F2937">Node 1</text><rect x="100" y="140" width="170" height="36" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="185" y="161.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">PVE 9</text><rect x="290" y="140" width="170" height="36" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="375" y="161.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">PVE 9</text><rect x="480" y="140" width="170" height="36" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="565" y="161.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">PVE 9</text><text x="80" y="211" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="end" fill="#1F2937">Node 2</text><rect x="100" y="186" width="170" height="36" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="185" y="207.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">PVE 8</text><rect x="290" y="186" width="170" height="36" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="375" y="207.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">PVE 9</text><rect x="480" y="186" width="170" height="36" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="565" y="207.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">PVE 9</text><text x="80" y="257" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="end" fill="#1F2937">Node 3</text><rect x="100" y="232" width="170" height="36" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="185" y="253.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">PVE 8</text><rect x="290" y="232" width="170" height="36" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="375" y="253.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">PVE 8</text><rect x="480" y="232" width="170" height="36" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="565" y="253.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">PVE 9</text><text x="185" y="300" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">Step 1</text><text x="375" y="300" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">Step 2</text><text x="565" y="300" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">Step 3: done</text><rect x="690" y="140" width="150" height="128" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="765" y="171.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">When all nodes</text><text x="765" y="189.9" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">run 9:</text><text x="765" y="206.9" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">HA groups become</text><text x="765" y="223.9" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">HA rules</text><text x="765" y="240.9" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">automatically</text><text x="400" y="330" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Mixed clusters work during the upgrade. Migrating 8 → 9 always works, but 9 → 8 is not supported.</text>
