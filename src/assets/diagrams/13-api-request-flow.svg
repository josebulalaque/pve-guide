<rect x="20" y="15" width="180" height="52" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="110" y="45.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Custom app</text><line x1="110" y1="67" x2="110" y2="470" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5 5"/><rect x="250" y="15" width="180" height="52" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="340" y="35.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Node A</text><text x="340" y="54.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">pveproxy</text><line x1="340" y1="67" x2="340" y2="470" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5 5"/><rect x="480" y="15" width="180" height="52" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="570" y="35.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Node B</text><text x="570" y="54.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">pveproxy</text><line x1="570" y1="67" x2="570" y2="470" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5 5"/><rect x="710" y="15" width="180" height="52" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="800" y="35.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Node B</text><text x="800" y="54.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">pvedaemon</text><line x1="800" y1="67" x2="800" y2="470" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5 5"/><line x1="110" y1="115" x2="340" y2="115" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="122" y="107" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1F2937" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">1. Start VM 105</text><rect x="240" y="143" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="340" y="163.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">2. Check token + permissions</text><line x1="340" y1="215" x2="570" y2="215" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="352" y="207" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1F2937" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">3. Forward: VM 105 is on Node B</text><line x1="570" y1="265" x2="800" y2="265" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="582" y="257" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1F2937" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">4. Run the action</text><rect x="690" y="293" width="200" height="34" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="790" y="313.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">5. Start a background task</text><line x1="800" y1="365" x2="110" y2="365" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="122" y="357" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#1F2937" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">6. Reply straight away with a task ID (UPID)</text><line x1="110" y1="410" x2="340" y2="410" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="122" y="402" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1F2937" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">7. Check task status (repeat)</text><line x1="340" y1="455" x2="110" y2="455" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="122" y="447" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1F2937" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">8. "stopped" + OK or error</text>
