="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4B5563">zones, vnets, subnets, fabrics…</text><line x1="48" y1="287" x2="70" y2="287" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="274" width="230" height="26" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="185" y="290.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">firewall/</text><text x="330" y="292" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4B5563">cluster.fw, &lt;vmid&gt;.fw</text><line x1="48" y1="319" x2="70" y2="319" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="306" width="230" height="26" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="185" y="322.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">priv/</text><text x="330" y="324" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4B5563">secrets: keys and token hashes (never share)</text><line x1="48" y1="351" x2="70" y2="351" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="338" width="230" height="26" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="185" y="354.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">nodes/&lt;node&gt;/</text><text x="330" y="356" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4B5563">one folder per node</text><line x1="88" y1="383" x2="110" y2="383" stroke="#9CA3AF" stroke-width="1.5"/><rect x="110" y="370" width="210" height="26" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="215" y="386.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">qemu-server/&lt;vmid&gt;.conf</text><text x="330" y="388" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4B5563">VM settings</text><line x1="88" y1="415" x2="110" y2="415" stroke="#9CA3AF" stroke-width="1.5"/><rect x="110" y="402" width="210" height="26" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="215" y="418.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">lxc/&lt;vmid&gt;.conf</text><text x="330" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4B5563">container settings</text><line x1="88" y1="447" x2="110" y2="447" stroke="#9CA3AF" stroke-width="1.5"/><rect x="110" y="434" width="210" height="26" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="215" y="450.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">host.fw</text><text x="330" y="452" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4B5563">node firewall rules</text><line x1="48" y1="44" x2="48" y2="351" stroke="#9CA3AF" stroke-width="1.5"/><line x1="88" y1="364" x2="88" y2="447" stroke="#9CA3AF" stroke-width="1.5"/><rect x="600" y="360" width="240" height="76" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="720" y="383.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Moving a VM to another node</text><text x="720" y="401.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">= moving its .conf file to that</text><text x="720" y="418.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">node's folder. Proxmox does this.</text>
</svg>