<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="30" y="18" width="250" height="26" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="155" y="34.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">/etc/pve/</text><text x="330" y="36" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">shared across the cluster (pmxcfs)</text><line x1="48" y1="63" x2="70" y2="63" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="50" width="230" height="26" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="185" y="66.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">datacenter.cfg</text><text x="330" y="68" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">cluster-wide options</text><line x1="48" y1="95" x2="70" y2="95" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="82" width="230" height="26" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="185" y="98.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">storage.cfg</text><text x="330" y="100" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">all storage definitions</text><line x1="48" y1="127" x2="70" y2="127" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="114" width="230" height="26" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="185" y="130.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">user.cfg</text><text x="330" y="132" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">users, groups, roles, ACLs</text><line x1="48" y1="159" x2="70" y2="159" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="146" width="230" height="26" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="185" y="162.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">corosync.conf</text><text x="330" y="164" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">cluster membership</text><line x1="48" y1="191" x2="70" y2="191" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="178" width="230" height="26" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="185" y="194.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">jobs.cfg</text><text x="330" y="196" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">backup jobs</text><line x1="48" y1="223" x2="70" y2="223" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="210" width="230" height="26" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="185" y="226.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">ha/</text><text x="330" y="228" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">HA resources, rules (PVE 9) or groups (PVE 8)</text><line x1="48" y1="255" x2="70" y2="255" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="242" width="230" height="26" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="185" y="258.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">sdn/</text><text x="330" y="260" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">zones, vnets, subnets, fabrics…</text><line x1="48" y1="287" x2="70" y2="287" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="274" width="230" height="26" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="185" y="290.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">firewall/</text><text x="330" y="292" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">cluster.fw, &lt;vmid&gt;.fw</text><line x1="48" y1="319" x2="70" y2="319" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="306" width="230" height="26" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="185" y="322.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">priv/</text><text x="330" y="324" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">secrets: keys and token hashes (never share)</text><line x1="48" y1="351" x2="70" y2="351" stroke="#9CA3AF" stroke-width="1.5"/><rect x="70" y="338" width="230" height="26" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="185" y="354.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">nodes/&lt;node&gt;/</text><text x="330" y="356" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">one folder per node</text><line x1="88" y1="383" x2="110" y2="383" stroke="#9CA3AF" stroke-width="1.5"/><rect x="110" y="370" width="210" height="26" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="215" y="386.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">qemu-server/&lt;vmid&gt;.conf</text><text x="330" y="388" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">VM settings</text><line x1="88" y1="415" x2="110" y2="415" stroke="#9CA3AF" stroke-width="1.5"/><rect x="110" y="402" width="210" height="26" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="215" y="418.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">lxc/&lt;vmid&gt;.conf</text><text x="330" y="420" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">container settings</text><line x1="88" y1="447" x2="110" y2="447" stroke="#9CA3AF" stroke-width="1.5"/><rect x="110" y="434" width="210" height="26" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="215" y="450.6" font-family="Liberation Sans" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2937">host.fw</text><text x="330" y="452" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="start" fill="#4B5563">node firewall rules</text><line x1="48" y1="44" x2="48" y2="351" stroke="#9CA3AF" stroke-width="1.5"/><line x1="88" y1="364" x2="88" y2="447" stroke="#9CA3AF" stroke-width="1.5"/><rect x="600" y="360" width="240" height="76" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="720" y="383.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Moving a VM to another node</text><text x="720" y="401.9" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">= moving its .conf file to that</text><text x="720" y="418.9" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">node's folder. Proxmox does this.</text>
</svg>