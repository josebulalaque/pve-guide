<rect x="30" y="20" width="760" height="55" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="410" y="42.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Custom app</text><text x="410" y="61.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">talks to Proxmox through the REST API</text><line x1="410" y1="75" x2="410" y2="97" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="30" y="100" width="760" height="95" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="410" y="124" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Proxmox VE management layer</text><rect x="40" y="140" width="98" height="38" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="89" y="162.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Web UI</text><rect x="147" y="140" width="98" height="38" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="196" y="162.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">REST API</text><rect x="254" y="140" width="98" height="38" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="303" y="162.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Clustering &amp; HA</text><rect x="361" y="140" width="98" height="38" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="410" y="162.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Ceph</text><rect x="468" y="140" width="98" height="38" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="517" y="162.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">SDN</text><rect x="575" y="140" width="98" height="38" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="624" y="162.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Firewall</text><rect x="682" y="140" width="98" height="38" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="731" y="162.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Backups / PBS</text><rect x="30" y="210" width="372" height="55" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="216" y="232.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">QEMU</text><text x="216" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">builds each VM's virtual hardware</text><rect x="418" y="210" width="372" height="55" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="604" y="232.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">LXC</text><text x="604" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">creates and isolates containers</text><rect x="30" y="280" width="760" height="95" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="410" y="302" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Linux kernel (Debian)</text><rect x="50" y="316" width="352" height="45" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="226" y="333.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">KVM</text><text x="226" y="351.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">runs VM code directly on the CPU</text><rect x="438" y="316" width="332" height="45" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="604" y="333.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Namespaces &amp; cgroups</text><text x="604" y="351.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">keep containers apart</text><rect x="30" y="390" width="760" height="50" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="410" y="409.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Physical server</text><text x="410" y="428.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">CPU (VT-x / AMD-V) · RAM · disks · network cards</text>
