<rect x="20" y="30" width="124" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="82" y="59.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">1. Find it</text><text x="82" y="77.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">ceph osd tree</text><line x1="144" y1="65" x2="158" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="160" y="30" width="124" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="222" y="59.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">2. Out</text><text x="222" y="77.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">ceph osd out &lt;id&gt;</text><line x1="284" y1="65" x2="298" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="30" width="124" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="362" y="59.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">3. Wait</text><text x="362" y="77.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">until rebalanced</text><line x1="424" y1="65" x2="438" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="440" y="30" width="124" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="502" y="59.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">4. Stop + destroy</text><text x="502" y="77.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">pveceph osd destroy</text><line x1="564" y1="65" x2="578" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="30" width="124" height="70" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="642" y="59.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">5. Swap the disk</text><text x="642" y="77.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">same type and size</text><line x1="704" y1="65" x2="718" y2="65" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="720" y="30" width="124" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="782" y="59.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">6. Create</text><text x="782" y="77.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">pveceph osd create</text><text x="430" y="134" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Ceph rebalances on its own after step 6, until health returns to HEALTH_OK.</text>
