<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="20" y="30" width="230" height="190" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="135" y="56" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Proxmox Cloud-Init tab</text><rect x="40" y="72" width="190" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="135" y="89.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">User + password</text><rect x="40" y="108" width="190" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="135" y="125.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">SSH public key</text><rect x="40" y="144" width="190" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="135" y="161.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">IP address / DHCP</text><rect x="40" y="180" width="190" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="135" y="197.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">DNS servers</text><line x1="250" y1="125" x2="333" y2="125" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="291" y="115" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">builds</text><rect x="337" y="85" width="150" height="80" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="412" y="119.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Cloud-init drive</text><text x="412" y="138.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">a small virtual CD</text><line x1="487" y1="125" x2="566" y2="125" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="527" y="115" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">read at boot</text><rect x="570" y="30" width="270" height="190" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="705" y="56" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">VM on first boot</text><rect x="590" y="72" width="230" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="705" y="89.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">Sets the hostname</text><rect x="590" y="108" width="230" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="705" y="125.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">Creates the user</text><rect x="590" y="144" width="230" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="705" y="161.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">Installs the SSH key</text><rect x="590" y="180" width="230" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="705" y="197.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">Configures the network</text><text x="430" y="250" font-family="Liberation Sans" font-size="13" font-weight="400" font-style="italic" text-anchor="middle" fill="#4B5563">The OS inside the template must have cloud-init installed. Most "cloud images" do.</text>
</svg>