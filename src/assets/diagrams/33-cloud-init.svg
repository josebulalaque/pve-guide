<style>@media (prefers-color-scheme: dark){[fill="#F3F4F6"]{fill:#262a33}[fill="#DBEAFE"]{fill:#172554}[fill="#EDE9FE"]{fill:#2e1065}[fill="#FFEDD5"]{fill:#431407}[fill="#DCFCE7"]{fill:#052e16}[fill="#E0F2FE"]{fill:#082f49}[fill="#FEF3C7"]{fill:#422006}[fill="#FEE2E2"]{fill:#450a0a}[fill="#FAFAFA"]{fill:#1b1d24}[fill="#F9FAFB"]{fill:#23262f}[stroke="#6B7280"]{stroke:#9ca3af}[stroke="#2563EB"]{stroke:#60a5fa}[stroke="#7C3AED"]{stroke:#a78bfa}[stroke="#EA580C"]{stroke:#fb923c}[stroke="#16A34A"]{stroke:#4ade80}[stroke="#0284C7"]{stroke:#38bdf8}[stroke="#D97706"]{stroke:#fbbf24}[stroke="#DC2626"]{stroke:#f87171}[stroke="#9CA3AF"]{stroke:#6b7280}[stroke="#E5E7EB"]{stroke:#374151}[stroke="#D1D5DB"]{stroke:#4b5563}:not(circle)[fill="#6B7280"]{fill:#9ca3af}:not(circle)[fill="#2563EB"]{fill:#60a5fa}:not(circle)[fill="#7C3AED"]{fill:#a78bfa}:not(circle)[fill="#EA580C"]{fill:#fb923c}:not(circle)[fill="#16A34A"]{fill:#4ade80}:not(circle)[fill="#0284C7"]{fill:#38bdf8}:not(circle)[fill="#D97706"]{fill:#fbbf24}:not(circle)[fill="#DC2626"]{fill:#f87171}text[fill="#1F2937"]{fill:#e5e7eb}[fill="#4B5563"]{fill:#9ca3af}rect[fill="#FFFFFF"]{fill:#23262f}text[stroke="#FFFFFF"]{stroke:#17181c}}</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect x="20" y="30" width="230" height="190" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="135" y="56" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Proxmox Cloud-Init tab</text><rect x="40" y="72" width="190" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="135" y="89.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">User + password</text><rect x="40" y="108" width="190" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="135" y="125.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">SSH public key</text><rect x="40" y="144" width="190" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="135" y="161.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">IP address / DHCP</text><rect x="40" y="180" width="190" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="135" y="197.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">DNS servers</text><line x1="250" y1="125" x2="333" y2="125" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="291" y="115" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">builds</text><rect x="337" y="85" width="150" height="80" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="412" y="119.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Cloud-init drive</text><text x="412" y="138.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">a small virtual CD</text><line x1="487" y1="125" x2="566" y2="125" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="527" y="115" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">read at boot</text><rect x="570" y="30" width="270" height="190" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="705" y="56" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">VM on first boot</text><rect x="590" y="72" width="230" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="705" y="89.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Sets the hostname</text><rect x="590" y="108" width="230" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="705" y="125.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Creates the user</text><rect x="590" y="144" width="230" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="705" y="161.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Installs the SSH key</text><rect x="590" y="180" width="230" height="28" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="705" y="197.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Configures the network</text><text x="430" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="italic" text-anchor="middle" fill="#4B5563">The OS inside the template must have cloud-init installed. Most "cloud images" do.</text>
</svg>