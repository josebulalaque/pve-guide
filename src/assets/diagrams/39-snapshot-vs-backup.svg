<style>@media (prefers-color-scheme: dark){[fill="#F3F4F6"]{fill:#262a33}[fill="#DBEAFE"]{fill:#172554}[fill="#EDE9FE"]{fill:#2e1065}[fill="#FFEDD5"]{fill:#431407}[fill="#DCFCE7"]{fill:#052e16}[fill="#E0F2FE"]{fill:#082f49}[fill="#FEF3C7"]{fill:#422006}[fill="#FEE2E2"]{fill:#450a0a}[fill="#FAFAFA"]{fill:#1b1d24}[fill="#F9FAFB"]{fill:#23262f}[stroke="#6B7280"]{stroke:#9ca3af}[stroke="#2563EB"]{stroke:#60a5fa}[stroke="#7C3AED"]{stroke:#a78bfa}[stroke="#EA580C"]{stroke:#fb923c}[stroke="#16A34A"]{stroke:#4ade80}[stroke="#0284C7"]{stroke:#38bdf8}[stroke="#D97706"]{stroke:#fbbf24}[stroke="#DC2626"]{stroke:#f87171}[stroke="#9CA3AF"]{stroke:#6b7280}[stroke="#E5E7EB"]{stroke:#374151}[stroke="#D1D5DB"]{stroke:#4b5563}:not(circle)[fill="#6B7280"]{fill:#9ca3af}:not(circle)[fill="#2563EB"]{fill:#60a5fa}:not(circle)[fill="#7C3AED"]{fill:#a78bfa}:not(circle)[fill="#EA580C"]{fill:#fb923c}:not(circle)[fill="#16A34A"]{fill:#4ade80}:not(circle)[fill="#0284C7"]{fill:#38bdf8}:not(circle)[fill="#D97706"]{fill:#fbbf24}:not(circle)[fill="#DC2626"]{fill:#f87171}text[fill="#1F2937"]{fill:#e5e7eb}[fill="#4B5563"]{fill:#9ca3af}rect[fill="#FFFFFF"]{fill:#23262f}text[stroke="#FFFFFF"]{stroke:#17181c}}</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<text x="210" y="30" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">Snapshot</text><rect x="30" y="45" width="360" height="150" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="210" y="68" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Same storage as the VM disk</text><rect x="55" y="95" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="100" y="118.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">snap1</text><line x1="145" y1="115" x2="168" y2="115" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="170" y="95" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="215" y="118.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">snap2</text><line x1="260" y1="115" x2="283" y2="115" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="285" y="95" width="90" height="40" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="330" y="118.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">now</text><text x="210" y="170" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">roll back in seconds</text><text x="210" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Quick undo before a risky change.</text><text x="210" y="242" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#DC2626">Lost if the storage is lost. Not a backup.</text><text x="645" y="30" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">Backup</text><rect x="460" y="70" width="150" height="80" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="535" y="104.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">VM disk</text><text x="535" y="123.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">on Ceph</text><line x1="610" y1="110" x2="678" y2="110" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="644" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">copy</text><rect x="682" y="55" width="160" height="110" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="762" y="95.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Proxmox</text><text x="762" y="114.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Backup Server</text><text x="762" y="131.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">separate hardware</text><text x="645" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">A separate copy, kept for days or months.</text><text x="645" y="242" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#16A34A">Survives losing the VM, the disk or the cluster.</text>
</svg>