<svg xmlns="http://www.w3.org/2000/svg" width="860" height="262" viewBox="0 0 860 262">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="210" y="30" font-family="Liberation Sans" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">Snapshot</text><rect x="30" y="45" width="360" height="150" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="210" y="68" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">Same storage as the VM disk</text><rect x="55" y="95" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="100" y="118.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">snap1</text><line x1="145" y1="115" x2="168" y2="115" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="170" y="95" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="215" y="118.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">snap2</text><line x1="260" y1="115" x2="283" y2="115" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="285" y="95" width="90" height="40" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="330" y="118.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">now</text><text x="210" y="170" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">roll back in seconds</text><text x="210" y="222" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Quick undo before a risky change.</text><text x="210" y="242" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#DC2626">Lost if the storage is lost. Not a backup.</text><text x="645" y="30" font-family="Liberation Sans" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">Backup</text><rect x="460" y="70" width="150" height="80" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="535" y="104.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">VM disk</text><text x="535" y="123.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">on Ceph</text><line x1="610" y1="110" x2="678" y2="110" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="644" y="100" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">copy</text><rect x="682" y="55" width="160" height="110" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="762" y="95.2" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Proxmox</text><text x="762" y="114.2" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">Backup Server</text><text x="762" y="131.2" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">separate hardware</text><text x="645" y="222" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">A separate copy, kept for days or months.</text><text x="645" y="242" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#16A34A">Survives losing the VM, the disk or the cluster.</text>
</svg>