<text x="210" y="32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">Virtual machines (KVM)</text><text x="210" y="54" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">each VM brings its own operating system</text><rect x="40" y="80" width="165" height="165" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="122" y="102" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">VM</text><rect x="52" y="114" width="141" height="40" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="122.5" y="137.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">App</text><rect x="52" y="162" width="141" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="122.5" y="191.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Guest OS</text><text x="122.5" y="209.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">with its own kernel</text><rect x="215" y="80" width="165" height="165" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="297" y="102" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">VM</text><rect x="227" y="114" width="141" height="40" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="297.5" y="137.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">App</text><rect x="227" y="162" width="141" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="297.5" y="191.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Guest OS</text><text x="297.5" y="209.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">with its own kernel</text><rect x="40" y="255" width="340" height="45" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="210" y="281.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Host Linux kernel + KVM</text><rect x="40" y="310" width="340" height="45" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="210" y="336.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Physical server</text><text x="630" y="32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">Containers (LXC)</text><text x="630" y="54" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">containers share the host's kernel</text><rect x="460" y="150" width="110" height="95" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="515" y="172" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Container</text><rect x="470" y="184" width="90" height="26" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="515" y="200.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">App</text><text x="515" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Linux files only</text><rect x="575" y="150" width="110" height="95" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="630" y="172" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Container</text><rect x="585" y="184" width="90" height="26" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="630" y="200.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">App</text><text x="630" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Linux files only</text><rect x="690" y="150" width="110" height="95" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="745" y="172" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Container</text><rect x="700" y="184" width="90" height="26" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="745" y="200.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">App</text><text x="745" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Linux files only</text><rect x="460" y="255" width="340" height="45" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="630" y="281.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Shared host Linux kernel</text><rect x="460" y="310" width="340" height="45" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="630" y="336.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Physical server</text><text x="210" y="380" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="italic" text-anchor="middle" fill="#4B5563">Stronger isolation · any OS · more overhead</text><text x="630" y="380" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="italic" text-anchor="middle" fill="#4B5563">Lighter and faster · Linux only · less isolation</text><line x1="420" y1="20" x2="420" y2="360" stroke="#E5E7EB" stroke-width="2"/>
</svg>