beration Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">500 / 595 / 596</text><rect x="450" y="140" width="175" height="64" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="537.5" y="166.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Proxmox or node problem</text><text x="537.5" y="184.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">quorum, lock, node unreachable</text><line x1="430" y1="54" x2="752" y2="92" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="665" y="95" width="175" height="34" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="752.5" y="116.2" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Task error</text><rect x="665" y="140" width="175" height="64" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="752.5" y="166.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Started, then failed</text><text x="752.5" y="184.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">read the task log</text><text x="430" y="232" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Then check: task log → node system log (pvedaemon, pveproxy) → cluster and Ceph health</text>
