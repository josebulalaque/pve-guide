<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="20" y="60" width="170" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="105" y="89.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">1. Call the API</text><text x="105" y="108.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">e.g. POST …/clone</text><line x1="190" y1="95" x2="238" y2="95" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="214" y="85" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">UPID</text><rect x="242" y="60" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="337" y="89.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">2. GET …/tasks/{upid}</text><text x="337" y="108.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">/status</text><line x1="432" y1="95" x2="488" y2="95" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="492" y="55" width="150" height="80" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="567" y="99.5" font-family="Liberation Sans" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">status?</text><line x1="567" y1="55" x2="567" y2="25" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><path d="M567,25 L337,25 L337,58" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="452" y="18" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">running: wait 1–2 s, then ask again</text><rect x="700" y="30" width="145" height="56" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="772.5" y="52.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">exitstatus = OK</text><text x="772.5" y="70.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">success</text><rect x="700" y="108" width="145" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="772.5" y="132.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">anything else</text><text x="772.5" y="150.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">failed: read …/log</text><line x1="642" y1="80" x2="697" y2="58" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="668" y="60" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">stopped</text><line x1="642" y1="112" x2="697" y2="138" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="430" y="200" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">A reply to the first call only means "the task started". Only exitstatus tells you the result.</text><text x="430" y="222" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Always set an overall timeout, and never resend the original action just because polling failed.</text>
</svg>