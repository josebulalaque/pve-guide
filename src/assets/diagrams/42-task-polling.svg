<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240">
<style>@media (prefers-color-scheme: dark){[fill="#F3F4F6"]{fill:#262a33}[fill="#DBEAFE"]{fill:#172554}[fill="#EDE9FE"]{fill:#2e1065}[fill="#FFEDD5"]{fill:#431407}[fill="#DCFCE7"]{fill:#052e16}[fill="#E0F2FE"]{fill:#082f49}[fill="#FEF3C7"]{fill:#422006}[fill="#FEE2E2"]{fill:#450a0a}[fill="#FAFAFA"]{fill:#1b1d24}[fill="#F9FAFB"]{fill:#23262f}[stroke="#6B7280"]{stroke:#9ca3af}[stroke="#2563EB"]{stroke:#60a5fa}[stroke="#7C3AED"]{stroke:#a78bfa}[stroke="#EA580C"]{stroke:#fb923c}[stroke="#16A34A"]{stroke:#4ade80}[stroke="#0284C7"]{stroke:#38bdf8}[stroke="#D97706"]{stroke:#fbbf24}[stroke="#DC2626"]{stroke:#f87171}[stroke="#9CA3AF"]{stroke:#6b7280}[stroke="#E5E7EB"]{stroke:#374151}[stroke="#D1D5DB"]{stroke:#4b5563}:not(circle)[fill="#6B7280"]{fill:#9ca3af}:not(circle)[fill="#2563EB"]{fill:#60a5fa}:not(circle)[fill="#7C3AED"]{fill:#a78bfa}:not(circle)[fill="#EA580C"]{fill:#fb923c}:not(circle)[fill="#16A34A"]{fill:#4ade80}:not(circle)[fill="#0284C7"]{fill:#38bdf8}:not(circle)[fill="#D97706"]{fill:#fbbf24}:not(circle)[fill="#DC2626"]{fill:#f87171}text[fill="#1F2937"]{fill:#e5e7eb}[fill="#4B5563"]{fill:#9ca3af}rect[fill="#FFFFFF"]{fill:#23262f}text[stroke="#FFFFFF"]{stroke:#17181c}}</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect x="20" y="60" width="170" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="105" y="89.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">1. Call the API</text><text x="105" y="108.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">e.g. POST …/clone</text><line x1="190" y1="95" x2="238" y2="95" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="214" y="85" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">UPID</text><rect x="242" y="60" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="337" y="89.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">2. GET …/tasks/{upid}</text><text x="337" y="108.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">/status</text><line x1="432" y1="95" x2="488" y2="95" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="492" y="55" width="150" height="80" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="567" y="99.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">status?</text><line x1="567" y1="55" x2="567" y2="25" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><path d="M567,25 L337,25 L337,58" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="452" y="18" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">running: wait 1–2 s, then ask again</text><rect x="700" y="30" width="145" height="56" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="772.5" y="52.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">exitstatus = OK</text><text x="772.5" y="70.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">success</text><rect x="700" y="108" width="145" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="772.5" y="132.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">anything else</text><text x="772.5" y="150.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">failed: read …/log</text><line x1="642" y1="80" x2="697" y2="58" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="662" y="52" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">stopped</text><line x1="642" y1="112" x2="697" y2="138" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="430" y="200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">A reply to the first call only means "the task started". Only exitstatus tells you the result.</text><text x="430" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Always set an overall timeout, and never resend the original action just because polling failed.</text>
</svg>