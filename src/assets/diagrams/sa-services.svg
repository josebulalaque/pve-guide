<rect x="20" y="15" width="820" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="430" y="38.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Users and apps: browser or API, HTTPS port 8006</text><line x1="430" y1="55" x2="430" y2="78" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="80" width="260" height="60" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="150" y="104.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">pveproxy</text><text x="150" y="123.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">web UI + API, forwards to other nodes</text><rect x="300" y="80" width="260" height="60" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="430" y="104.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">pvedaemon</text><text x="430" y="123.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">carries out privileged actions</text><rect x="580" y="80" width="260" height="60" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="710" y="104.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">pvestatd</text><text x="710" y="123.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">status and usage graphs</text><line x1="280" y1="110" x2="298" y2="110" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="160" width="260" height="60" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="150" y="184.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">pve-cluster (pmxcfs)</text><text x="150" y="203.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">/etc/pve shared config</text><rect x="300" y="160" width="260" height="60" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="430" y="184.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">corosync</text><text x="430" y="203.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">cluster membership + quorum</text><rect x="580" y="160" width="260" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="710" y="184.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">pve-ha-crm / pve-ha-lrm</text><text x="710" y="203.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">+ watchdog-mux: never kill</text><line x1="150" y1="140" x2="150" y2="158" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="430" y1="140" x2="150" y2="158" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><line x1="280" y1="190" x2="298" y2="190" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="580" y1="190" x2="562" y2="190" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="240" width="195" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="117.5" y="259.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">pve-firewall</text><text x="117.5" y="277.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">firewall rules</text><rect x="228" y="240" width="195" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="325.5" y="259.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">pvescheduler</text><text x="325.5" y="277.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">backup + replication jobs</text><rect x="436" y="240" width="195" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="533.5" y="259.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">spiceproxy</text><text x="533.5" y="277.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">SPICE console, port 3128</text><rect x="644" y="240" width="196" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="742" y="259.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">ceph-mon / mgr / osd</text><text x="742" y="277.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">Ceph, per node</text><text x="430" y="318" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#DC2626">Red = restarting or killing it can reboot the node. Check 4.4 before restarting anything.</text>
