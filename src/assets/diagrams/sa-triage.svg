<rect x="300" y="10" width="260" height="46" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="430" y="37.2" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Something is wrong</text><text x="430" y="82" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">How much is affected?</text><line x1="430" y1="90" x2="150" y2="118" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="120" width="260" height="40" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="150" y="144.5" font-family="Liberation Sans" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">One VM</text><rect x="35" y="170" width="230" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="150" y="188.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">Task log of the VM</text><rect x="35" y="206" width="230" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="150" y="224.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">Console: is the OS up?</text><rect x="35" y="242" width="230" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="150" y="260.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">NIC, firewall, disk</text><line x1="430" y1="90" x2="430" y2="118" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="120" width="260" height="40" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="430" y="144.5" font-family="Liberation Sans" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">One node</text><rect x="315" y="170" width="230" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="430" y="188.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">Node reachable? (IPMI)</text><rect x="315" y="206" width="230" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="430" y="224.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">pveproxy / pvestatd</text><rect x="315" y="242" width="230" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="430" y="260.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">Quorum, HA fencing</text><line x1="430" y1="90" x2="710" y2="118" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="120" width="260" height="40" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="710" y="144.5" font-family="Liberation Sans" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">Many / all</text><rect x="595" y="170" width="230" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="710" y="188.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">pvecm status (quorum)</text><rect x="595" y="206" width="230" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="710" y="224.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">ceph -s (storage)</text><rect x="595" y="242" width="230" height="30" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="710" y="260.6" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#1F2937">Network between nodes</text><text x="430" y="302" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#DC2626">Customer-facing outage, or data at risk? Escalate straight away while you investigate.</text>
