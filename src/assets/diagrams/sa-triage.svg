on Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Network between nodes</text><text x="430" y="302" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#DC2626">Customer-facing outage, or data at risk? Escalate straight away while you investigate.</text>
