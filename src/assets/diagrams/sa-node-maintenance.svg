<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="20" y="20" width="250" height="64" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="145" y="46.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">1. Maintenance mode</text><text x="145" y="65.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">HA VMs move away</text><line x1="270" y1="52" x2="298" y2="52" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="20" width="250" height="64" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="425" y="46.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">2. Ceph noout</text><text x="425" y="65.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">no re-copying</text><line x1="550" y1="52" x2="578" y2="52" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="20" width="250" height="64" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="705" y="46.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">3. Migrate the rest</text><text x="705" y="65.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">non-HA VMs</text><rect x="20" y="120" width="250" height="64" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="145" y="146.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">4. Patch + reboot</text><text x="145" y="165.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">apt dist-upgrade</text><line x1="270" y1="152" x2="298" y2="152" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="120" width="250" height="64" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="425" y="146.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">5. Verify</text><text x="425" y="165.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">node, Ceph, VMs</text><line x1="550" y1="152" x2="578" y2="152" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="120" width="250" height="64" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="705" y="146.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">6. Undo 2 and 1</text><text x="705" y="165.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">then next node</text><path d="M770,84 L770,102 L145,102 L145,118" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="430" y="222" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">One node at a time. Wait for HEALTH_OK before starting the next one.</text>
</svg>