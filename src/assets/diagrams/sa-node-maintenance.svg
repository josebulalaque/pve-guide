<style>@media (prefers-color-scheme: dark){[fill="#F3F4F6"]{fill:#262a33}[fill="#DBEAFE"]{fill:#172554}[fill="#EDE9FE"]{fill:#2e1065}[fill="#FFEDD5"]{fill:#431407}[fill="#DCFCE7"]{fill:#052e16}[fill="#E0F2FE"]{fill:#082f49}[fill="#FEF3C7"]{fill:#422006}[fill="#FEE2E2"]{fill:#450a0a}[fill="#FAFAFA"]{fill:#1b1d24}[fill="#F9FAFB"]{fill:#23262f}[stroke="#6B7280"]{stroke:#9ca3af}[stroke="#2563EB"]{stroke:#60a5fa}[stroke="#7C3AED"]{stroke:#a78bfa}[stroke="#EA580C"]{stroke:#fb923c}[stroke="#16A34A"]{stroke:#4ade80}[stroke="#0284C7"]{stroke:#38bdf8}[stroke="#D97706"]{stroke:#fbbf24}[stroke="#DC2626"]{stroke:#f87171}[stroke="#9CA3AF"]{stroke:#6b7280}[stroke="#E5E7EB"]{stroke:#374151}[stroke="#D1D5DB"]{stroke:#4b5563}:not(circle)[fill="#6B7280"]{fill:#9ca3af}:not(circle)[fill="#2563EB"]{fill:#60a5fa}:not(circle)[fill="#7C3AED"]{fill:#a78bfa}:not(circle)[fill="#EA580C"]{fill:#fb923c}:not(circle)[fill="#16A34A"]{fill:#4ade80}:not(circle)[fill="#0284C7"]{fill:#38bdf8}:not(circle)[fill="#D97706"]{fill:#fbbf24}:not(circle)[fill="#DC2626"]{fill:#f87171}text[fill="#1F2937"]{fill:#e5e7eb}[fill="#4B5563"]{fill:#9ca3af}rect[fill="#FFFFFF"]{fill:#23262f}text[stroke="#FFFFFF"]{stroke:#17181c}}</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect x="20" y="20" width="250" height="64" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="145" y="46.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">1. Maintenance mode</text><text x="145" y="65.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">HA VMs move away</text><line x1="270" y1="52" x2="298" y2="52" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="20" width="250" height="64" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="425" y="46.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">2. Ceph noout</text><text x="425" y="65.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">no re-copying</text><line x1="550" y1="52" x2="578" y2="52" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="20" width="250" height="64" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="705" y="46.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">3. Migrate the rest</text><text x="705" y="65.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">non-HA VMs</text><rect x="20" y="120" width="250" height="64" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="145" y="146.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">4. Patch + reboot</text><text x="145" y="165.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">apt dist-upgrade</text><line x1="270" y1="152" x2="298" y2="152" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="120" width="250" height="64" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="425" y="146.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">5. Verify</text><text x="425" y="165.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">node, Ceph, VMs</text><line x1="550" y1="152" x2="578" y2="152" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="120" width="250" height="64" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="705" y="146.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">6. Undo 2 and 1</text><text x="705" y="165.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">then next node</text><path d="M770,84 L770,102 L145,102 L145,118" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="430" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">One node at a time. Wait for HEALTH_OK before starting the next one.</text>
</svg>