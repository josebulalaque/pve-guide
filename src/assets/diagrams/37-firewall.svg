<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="20" y="30" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="start" fill="#1F2937">Traffic to a node (web UI, SSH)</text><rect x="20" y="45" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="95" y="73.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Network</text><line x1="170" y1="70" x2="228" y2="70" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="232" y="45" width="180" height="50" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="322" y="64.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Datacenter rules</text><text x="322" y="82.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">apply to every node</text><line x1="412" y1="70" x2="468" y2="70" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="472" y="45" width="160" height="50" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="552" y="64.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Node rules</text><text x="552" y="82.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">this node only</text><line x1="632" y1="70" x2="688" y2="70" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="692" y="45" width="150" height="50" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="767" y="64.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Node</text><text x="767" y="82.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">ports 8006, 22</text><text x="20" y="140" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="start" fill="#1F2937">Traffic to a VM or container</text><rect x="20" y="155" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="95" y="183.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Network</text><line x1="170" y1="180" x2="228" y2="180" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="232" y="155" width="400" height="50" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="432" y="174.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">VM / CT rules (can include security groups)</text><text x="432" y="192.9" font-family="Liberation Sans" font-size="11" font-weight="400" text-anchor="middle" fill="#4B5563">only if the NIC has firewall=1</text><line x1="632" y1="180" x2="688" y2="180" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="692" y="155" width="150" height="50" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="767" y="183.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">VM</text><rect x="20" y="235" width="822" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="431" y="254.9" font-family="Liberation Sans" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2937">Master switch: Datacenter → Firewall → Options → Enable</text><text x="431" y="272.9" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">when it is off, no rules apply anywhere · default policy: block incoming, allow outgoing</text>
</svg>