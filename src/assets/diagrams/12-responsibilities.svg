<svg xmlns="http://www.w3.org/2000/svg" width="830" height="290" viewBox="0 0 830 290">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="30" y="20" width="290" height="250" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="175" y="50" font-family="Liberation Sans" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">Custom app</text><rect x="48" y="68" width="254" height="31" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="175" y="87.4" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Decides what to create, when, for whom</text><rect x="48" y="107" width="254" height="31" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="175" y="126.4" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Calls the Proxmox API</text><rect x="48" y="146" width="254" height="31" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="175" y="165.4" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Waits for tasks to finish</text><rect x="48" y="185" width="254" height="31" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="175" y="204.4" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Keeps its own records</text><rect x="48" y="224" width="254" height="31" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="175" y="243.4" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Handles Proxmox errors</text><line x1="330" y1="115" x2="500" y2="115" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="415" y="103" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">API requests</text><line x1="500" y1="175" x2="330" y2="175" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="415" y="163" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#4B5563">results + task IDs</text><rect x="510" y="20" width="290" height="250" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="655" y="50" font-family="Liberation Sans" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">Proxmox</text><rect x="528" y="64" width="254" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="655" y="81.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Runs VMs and containers</text><rect x="528" y="98" width="254" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="655" y="115.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Stores disks (Ceph)</text><rect x="528" y="132" width="254" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="655" y="149.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Provides networks (SDN)</text><rect x="528" y="166" width="254" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="655" y="183.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Backs up (PBS)</text><rect x="528" y="200" width="254" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="655" y="217.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Keeps the cluster healthy</text><rect x="528" y="234" width="254" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="655" y="251.9" font-family="Liberation Sans" font-size="13" font-weight="400" text-anchor="middle" fill="#1F2937">Checks permissions</text>
</svg>