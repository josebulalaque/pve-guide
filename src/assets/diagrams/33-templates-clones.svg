<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="30" y="110" width="210" height="80" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="135" y="144.7" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Template 9000</text><text x="135" y="163.7" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">read-only master disk</text><rect x="450" y="20" width="380" height="100" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="640" y="55.2" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Full clone: VM 101</text><text x="640" y="74.2" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">an independent copy of every disk</text><text x="640" y="91.2" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">slower to create · template can be deleted</text><rect x="450" y="180" width="380" height="100" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="640" y="215.2" font-family="Liberation Sans" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2937">Linked clone: VM 102</text><text x="640" y="234.2" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">shares the template's disk, stores only its changes</text><text x="640" y="251.2" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563">fast and small · template must be kept</text><line x1="240" y1="135" x2="448" y2="70" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="340" y="92" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">copy all data</text><line x1="240" y1="165" x2="448" y2="215" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="340" y="175" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">clone</text><line x1="448" y1="255" x2="240" y2="180" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="330" y="250" font-family="Liberation Sans" font-size="12" font-weight="400" text-anchor="middle" fill="#4B5563" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">reads unchanged data</text>
